# Antes de la primera vez: cp .env.example .env   (y cambia la contraseña)
# Levanta todo con: docker compose up --build
# Pruebas del backend con: docker compose run --rm backend-tests
#
# El usuario y la contraseña de PostgreSQL salen de .env (no se versiona). El nombre de la
# base es fijo porque las pruebas del proyecto base lo exigen y no es un secreto.

x-db-env: &db-env
  POSTGRES_DB: autos_colombia
  POSTGRES_USER: "${POSTGRES_USER:?Falta .env. Ejecuta: cp .env.example .env}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta .env. Ejecuta: cp .env.example .env}"
  PGUSER: "${POSTGRES_USER:?Falta .env. Ejecuta: cp .env.example .env}"   # psql, pg_dump y pg_isready dentro del contenedor
  PGDATABASE: autos_colombia

x-backend-env: &backend-env
  DB_PORT: "5432"
  DB_NAME: autos_colombia
  DB_USER: "${POSTGRES_USER:?Falta .env. Ejecuta: cp .env.example .env}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:?Falta .env. Ejecuta: cp .env.example .env}"
  DB_CONNECT_TIMEOUT: "5"
  TZ: America/Bogota

services:
  db:
    image: postgres:17-alpine
    environment:
      <<: *db-env
      TZ: America/Bogota
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]   # por TCP: el servidor temporal de la inicialización no escucha por red
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 120s   # margen si PostgreSQL debe recuperarse de un apagado brusco

  backend:
    build: ./backend
    restart: on-failure:5   # reintenta si la base aún no responde; máx. 5 para no ocultar errores reales
    environment:
      <<: *backend-env
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: on-failure:5   # nginx se cierra si no encuentra el backend al arrancar
    depends_on:
      - backend
    ports:
      - "4200:80"

  # Base de pruebas desechable (en memoria): las pruebas nunca tocan los datos de la demo.
  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      <<: *db-env
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]   # por TCP: el servidor temporal de la inicialización no escucha por red
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 120s   # margen si PostgreSQL debe recuperarse de un apagado brusco

  backend-tests:
    profiles: ["test"]
    build: ./backend
    environment:
      <<: *backend-env
      DB_HOST: db-test
      RUN_POSTGRES_TESTS: "1"
    depends_on:
      db-test:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic -c alembic.ini upgrade head && python -m pytest -q"]

volumes:
  datos_postgres:
