# Antes de la primera vez: cp .env.example .env   (y cambia la contraseña)
# Levanta todo con: docker compose up --build
# Pruebas del backend con: docker compose run --rm backend-tests
#
# El usuario y la contraseña de PostgreSQL salen de .env (no se versiona). El nombre de la
# base es fijo porque las pruebas del proyecto base lo exigen y no es un secreto.

x-db-env: &db-env
  POSTGRES_DB: autos_colombia
  POSTGRES_USER: "${POSTGRES_USER:?Falta .env. Ejecuta: cp .env.example .env}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta .env. Ejecuta: cp .env.example .env}"
  PGUSER: "${POSTGRES_USER:?Falta .env. Ejecuta: cp .env.example .env}"   # psql, pg_dump y pg_isready dentro del contenedor
  PGDATABASE: autos_colombia

x-backend-env: &backend-env
  DB_PORT: "5432"
  DB_NAME: autos_colombia
  DB_USER: "${POSTGRES_USER:?Falta .env. Ejecuta: cp .env.example .env}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:?Falta .env. Ejecuta: cp .env.example .env}"
  DB_CONNECT_TIMEOUT: "5"
  TZ: America/Bogota
  # Iteración 2: clave para firmar los tokens de sesión y credenciales de las cuentas semilla.
  JWT_SECRETO: "${JWT_SECRETO:?Falta JWT_SECRETO en .env (ver .env.example)}"
  ADMIN_USUARIO: "${ADMIN_USUARIO:?Falta ADMIN_USUARIO en .env (ver .env.example)}"
  ADMIN_NOMBRE: "${ADMIN_NOMBRE:?Falta ADMIN_NOMBRE en .env (ver .env.example)}"
  ADMIN_CONTRASENA: "${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env (ver .env.example)}"
  MARTA_CONTRASENA: "${MARTA_CONTRASENA:?Falta MARTA_CONTRASENA en .env (ver .env.example)}"
  DIEGO_CONTRASENA: "${DIEGO_CONTRASENA:?Falta DIEGO_CONTRASENA en .env (ver .env.example)}"

services:
  db:
    image: postgres:17-alpine
    environment:
      <<: *db-env
      TZ: America/Bogota
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]   # por TCP: el servidor temporal de la inicialización no escucha por red
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 120s   # margen si PostgreSQL debe recuperarse de un apagado brusco

  backend:
    build: ./backend
    restart: on-failure:5   # reintenta si la base aún no responde; máx. 5 para no ocultar errores reales
    environment:
      <<: *backend-env
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: on-failure:5   # nginx se cierra si no encuentra el backend al arrancar
    depends_on:
      - backend
    ports:
      - "4200:80"

  # Base de pruebas desechable (en memoria): las pruebas nunca tocan los datos de la demo.
  db-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      <<: *db-env
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]   # por TCP: el servidor temporal de la inicialización no escucha por red
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 120s   # margen si PostgreSQL debe recuperarse de un apagado brusco

  backend-tests:
    profiles: ["test"]
    build: ./backend
    environment:
      <<: *backend-env
      DB_HOST: db-test
      RUN_POSTGRES_TESTS: "1"
    depends_on:
      db-test:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic -c alembic.ini upgrade head && python -m pytest -q"]

  # RNF-20 (caso NF-02): pruebas de extremo a extremo en Chrome, Edge y Firefox dentro de Docker.
  # Uso: docker compose --profile e2e run --rm --build e2e
  # Levanta la base, el backend y el frontend si no están corriendo, y usa la base de la demo
  # (solo ingresa y sale; no modifica datos). Las capturas y el reporte quedan en docs/evidencias/rnf20/.
  e2e:
    profiles: ["e2e"]
    build: ./e2e
    depends_on:
      - frontend
    environment:
      BASE_URL: http://frontend
      SALIDA: /e2e/salida
      TZ: America/Bogota
      ADMIN_USUARIO: "${ADMIN_USUARIO:?Falta ADMIN_USUARIO en .env (ver .env.example)}"
      ADMIN_CONTRASENA: "${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env (ver .env.example)}"
      MARTA_CONTRASENA: "${MARTA_CONTRASENA:?Falta MARTA_CONTRASENA en .env (ver .env.example)}"
    # Con el usuario del equipo, para que las capturas no queden a nombre de root.
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    shm_size: "1gb"   # Chrome y Edge necesitan más memoria compartida que la que trae Docker por defecto
    volumes:
      - ./docs/evidencias/rnf20:/e2e/salida
      - ./.git:/repo-git:ro   # solo para leer el commit que aparece en el reporte

volumes:
  datos_postgres:
