# Cumple el papel de proxy.conf.json dentro de Docker: mismo origen, sin CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Rutas de la API: se envían al contenedor del backend.
    # El nombre "backend" se resuelve con el DNS interno de Docker cada 10 s (no solo al arrancar):
    # si el backend se recrea con otra dirección, nginx lo sigue encontrando y no responde 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:8000;

    location ~ ^/(health|vehiculos|celdas|operadores|estancias|clientes|reportes|auth|cuentas)(/|$) {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rutas de pantalla de Angular: siempre se responde con index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Iteración 2: la página no se guarda en caché. Así el botón "atrás" después de cerrar sesión
    # no devuelve una página protegida desde la memoria del navegador (HU-17.2). Los .js y .css
    # llevan un hash en el nombre y sí se pueden guardar.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
