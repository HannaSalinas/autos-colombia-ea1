# Cumple el papel de proxy.conf.json dentro de Docker: mismo origen, sin CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Rutas de la API: se envían al contenedor del backend.
    location ~ ^/(health|vehiculos|celdas|operadores|estancias|clientes|reportes)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rutas de pantalla de Angular: siempre se responde con index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
