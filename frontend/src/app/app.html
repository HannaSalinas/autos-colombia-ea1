<div class="page-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="Autos Colombia, inicio">
      <span class="brand-mark" aria-hidden="true">AC</span><span>Autos Colombia</span>
    </a>
    @if (auth.cuenta(); as cuenta) {
      <nav aria-label="Navegación principal">
        @for (opcion of menu(); track opcion.ruta) {
          <a
            [routerLink]="opcion.ruta"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: !!opcion.exacta }"
            ariaCurrentWhenActive="page"
            >{{ opcion.etiqueta }}</a
          >
        }
      </nav>
      <div class="cuenta" aria-label="Sesión">
        <span class="cuenta-nombre">{{ cuenta.nombre }}</span>
        <span class="cuenta-rol">{{ rol() }} · {{ cuenta.nombre_usuario }}</span>
        <button type="button" class="salir" (click)="cerrarSesion()">Cerrar sesión</button>
      </div>
    }
  </header>
  <main><router-outlet /></main>
  <footer><span>Autos Colombia</span><span>Control vehicular con claridad.</span></footer>
</div>
